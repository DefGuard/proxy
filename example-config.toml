# This is an example config file for Defguard Edge.
# To use it, fill in actual values for your deployment below.

# port the API server will listen on
http_port = 8080
# port the gRPC server will listen on
grpc_port = 50051

# HTTP/2 keepalive ping interval and timeout for the gRPC server, in seconds
grpc_keepalive_interval_seconds = 10
grpc_keepalive_timeout_seconds = 20

log_level = "info"
rate_limit_per_second = 0
rate_limit_burst = 0
acme_staging = false
