name: Lint frontend

on:
  push:
    branches:
      - dev
      - "release/**"
      - "stable/**"
    paths-ignore:
      - "*.md"
      - "LICENSE"
  pull_request:
    branches:
      - dev
      - "release/**"
      - "stable/**"
    paths-ignore:
      - "*.md"
      - "LICENSE"

jobs:
  lint-web:
    runs-on:
      - codebuild-defguard-proxy-runner-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: Install NodeJS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26

      - name: Install pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          package_json_file: web/package.json
          cache: true
          run_install: false

      - name: Install deps
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build translations
        working-directory: web
        run: pnpm dlx @inlang/paraglide-js compile --project ./project.inlang --outdir ./src/paraglide

      - name: Lint
        working-directory: web
        run: pnpm lint

      - name: Audit
        working-directory: web
        run: pnpm audit --prod --ignore-unfixable
