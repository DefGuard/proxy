name: Test cross build

on:
  push:
    branches:
       - cross

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-freebsd:
    # needs: [create-release]
    runs-on:
      - self-hosted
      - Linux
      - X64
    steps:
      # Store the version, stripping any v-prefix
      - name: Write release version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo Version: $VERSION
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true
          version: 10

      - name: Build frontend
        run: pnpm install --ignore-scripts --frozen-lockfile && pnpm build
        working-directory: web

      - name: Sync with FreeBSD
        run:
          rsync -rlptxzH -e 'ssh -l root' --del ./ freebsd:work/

      - name: Build on FreeBSD
        run:
          ssh root@freebsd 'cd work && cargo build --locked --release'

      - name: Copy binary to host
        run:
          scp root@freebsd:work/target/release/defguard-proxy .
